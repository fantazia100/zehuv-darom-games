<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>חגורה לכל אחד — שבוע זה״ב | מחוז דרום</title>
<style>
:root {
  --sky-50: #f0f9ff; --sky-100: #e0f2fe; --sky-200: #bae6fd; --sky-300: #7dd3fc;
  --sky-500: #0ea5e9; --sky-600: #0284c7; --sky-700: #0369a1;
  --ink: #0f2744; --ink-soft: #334e68; --muted: #5a7a94;
  --paper: #ffffff; --card: #ffffff;
  --mint: #10b981; --mint-soft: #d1fae5;
  --coral: #ef4444; --coral-soft: #fee2e2;
  --amber: #f59e0b; --amber-soft: #fef3c7; --gold: #fbbf24;
  --radius: 1.1rem; --radius-btn: .85rem;
  --shadow: 0 10px 28px -10px rgba(15,39,68,.18), 0 2px 8px rgba(15,39,68,.06);
  --shadow-3d: 0 14px 0 -2px rgba(2,132,199,.12), 0 18px 36px -12px rgba(15,39,68,.22);
  --focus: 3px solid #0369a1;
  --font: Assistant, Heebo, Rubik, Arial, sans-serif;
  --touch: 48px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  font-family: var(--font); color: var(--ink);
  background:
    radial-gradient(1200px 600px at 100% -10%, #bae6fd 0%, transparent 55%),
    radial-gradient(900px 500px at -10% 110%, #a5f3fc 0%, transparent 50%),
    linear-gradient(180deg, var(--sky-50), #e8f7ff 40%, #f0f9ff);
  -webkit-tap-highlight-color: transparent;
}
body { line-height: 1.45; }
button, [role="button"] {
  font-family: inherit; cursor: pointer;
  min-height: var(--touch); min-width: var(--touch);
}
button:focus-visible, [tabindex="0"]:focus-visible, .choice:focus-visible, .buckle-btn:focus-visible {
  outline: var(--focus); outline-offset: 3px;
}
.app {
  max-width: 920px; margin: 0 auto; padding: 12px 14px 88px;
  min-height: 100dvh; position: relative;
}
.logo-corner {
  position: fixed; top: 10px; left: 10px; z-index: 40;
  height: 48px; width: auto; pointer-events: none;
  filter: drop-shadow(0 2px 6px rgba(15,39,68,.15));
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
}
.brand-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.85); border: 1px solid var(--sky-200);
  border-radius: 999px; padding: 6px 12px 6px 8px;
  font-size: .85rem; color: var(--sky-700); font-weight: 700;
  box-shadow: var(--shadow);
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: var(--touch); height: var(--touch);
  border-radius: 50%; border: 2px solid var(--sky-200);
  background: var(--paper); color: var(--ink); font-size: 1.25rem;
  box-shadow: var(--shadow);
}
.icon-btn[aria-pressed="true"] { background: var(--amber-soft); border-color: var(--amber); }
.progress-wrap {
  flex: 1; min-width: 140px; max-width: 280px;
  background: rgba(255,255,255,.7); border-radius: 999px; height: 12px;
  border: 1px solid var(--sky-200); overflow: hidden;
}
.progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--sky-500), var(--mint));
  border-radius: 999px; transition: width .35s ease;
}
@media (prefers-reduced-motion: reduce) {
  .progress-bar, .card, .feedback, .star, .screen.active, .belt-line { transition: none !important; animation: none !important; }
}
.screen { display: none; }
.screen.active { display: block; animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-3d); border: 1px solid rgba(14,165,233,.18);
  padding: 22px 20px 24px; position: relative;
}
.hero-icon {
  width: 88px; height: 88px; margin: 0 auto 12px;
  display: grid; place-items: center;
  background: linear-gradient(160deg, #e0f2fe, #cffafe);
  border-radius: 24px; border: 2px solid var(--sky-200);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.8), 0 8px 0 rgba(2,132,199,.1);
}
h1 {
  margin: 0 0 8px; text-align: center;
  font-size: clamp(1.7rem, 4.5vw, 2.4rem); color: var(--sky-700);
  font-weight: 800;
}
.subtitle {
  text-align: center; color: var(--ink-soft); margin: 0 0 20px;
  font-size: clamp(1rem, 2.5vw, 1.15rem); font-weight: 600;
}
.goals { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
.goals li {
  background: var(--sky-50); border: 1px solid var(--sky-200);
  border-radius: 12px; padding: 10px 14px; font-weight: 700; color: var(--ink-soft);
}
.age-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 20px; }
@media (max-width: 520px) { .age-grid { grid-template-columns: 1fr; } }
.age-btn {
  border: 3px solid var(--sky-200);
  background: linear-gradient(180deg, #fff, var(--sky-50));
  border-radius: var(--radius); padding: 18px 14px; text-align: center;
  box-shadow: var(--shadow); color: var(--ink);
}
.age-btn.selected {
  border-color: var(--sky-600);
  background: linear-gradient(180deg, #e0f2fe, #fff);
  box-shadow: 0 0 0 3px rgba(14,165,233,.25), var(--shadow);
}
.age-btn .age-label { display: block; font-size: 1.35rem; font-weight: 800; color: var(--sky-700); }
.age-btn .age-hint { display: block; margin-top: 4px; font-size: .95rem; color: var(--muted); font-weight: 600; }
.primary-btn, .next-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px 18px;
  border-radius: var(--radius-btn); font-size: 1.2rem; font-weight: 800;
  border: none; min-height: 52px;
}
.primary-btn {
  background: linear-gradient(180deg, #38bdf8, #0284c7); color: #fff;
  box-shadow: 0 6px 0 #0369a1, 0 10px 20px rgba(2,132,199,.28);
}
.primary-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.next-btn {
  background: linear-gradient(180deg, #34d399, #059669); color: #fff;
  box-shadow: 0 6px 0 #047857, 0 10px 20px rgba(16,185,129,.25); margin-top: 14px;
}
.q-meta {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
  font-weight: 700; color: var(--muted); font-size: .95rem;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--sky-100); color: var(--sky-700);
  border-radius: 999px; padding: 4px 12px; font-size: .9rem;
}
.question {
  font-size: clamp(1.25rem, 3.2vw, 1.65rem);
  font-weight: 800; margin: 0 0 16px; color: var(--ink); text-align: right;
}
.young .question, .young .choice, .young .knowledge-text, .young .age-btn .age-label,
.young h1, .young .subtitle, .young .feedback-text {
  font-size: clamp(1.3rem, 3.4vw, 1.75rem);
}
.young .choice { font-size: clamp(1.15rem, 3vw, 1.4rem); }
.choices { display: grid; gap: 10px; }
.choice {
  display: flex; align-items: flex-start; gap: 12px;
  text-align: right; width: 100%; padding: 14px;
  border-radius: 14px; border: 2.5px solid var(--sky-200);
  background: linear-gradient(180deg, #fff, #f8fcff);
  color: var(--ink); font-size: 1.1rem; font-weight: 700;
  box-shadow: 0 4px 0 rgba(2,132,199,.08);
}
.choice .letter {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px;
  display: grid; place-items: center; background: var(--sky-100);
  color: var(--sky-700); font-weight: 900; font-size: .95rem;
}
.choice .mark { margin-inline-start: auto; font-weight: 900; }
.choice.selected { border-color: var(--sky-500); background: #e0f2fe; }
.choice.correct { border-color: var(--mint) !important; background: var(--mint-soft) !important; }
.choice.wrong { border-color: var(--coral) !important; background: var(--coral-soft) !important; }
.feedback {
  display: none; margin-top: 12px; padding: 12px 14px; border-radius: 12px;
  font-weight: 800; align-items: center; gap: 8px;
}
.feedback.show { display: flex; }
.feedback.ok { background: var(--mint-soft); color: #065f46; border: 2px solid var(--mint); }
.feedback.bad { background: var(--coral-soft); color: #991b1b; border: 2px solid var(--coral); }
.feedback.info { background: var(--amber-soft); color: #92400e; border: 2px solid var(--amber); }
.knowledge { text-align: center; padding: 8px 4px; }
.knowledge-icon {
  width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 18px;
  display: grid; place-items: center; font-size: 2rem;
  background: linear-gradient(160deg, #fef3c7, #e0f2fe); border: 2px solid var(--amber);
}
.knowledge-text { font-size: clamp(1.15rem, 3vw, 1.4rem); font-weight: 800; color: var(--ink); margin: 0 0 8px; }
.hint-note { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 10px; font-weight: 600; }
.live-region { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.end-stars { display: flex; justify-content: center; gap: 10px; margin: 16px 0; font-size: 2.4rem; }
.star { opacity: .25; filter: grayscale(1); }
.star.on { opacity: 1; filter: none; transform: scale(1.1); }
.friend-bubble {
  display: inline-block; background: #fff; border: 2px solid var(--sky-300);
  border-radius: 16px; padding: 10px 14px; font-weight: 800; color: var(--ink-soft);
  box-shadow: var(--shadow); margin-bottom: 10px;
}
/* Car / buckle unique UI */
.car-cabin {
  background: linear-gradient(180deg, #e2e8f0, #cbd5e1);
  border: 3px solid #64748b; border-radius: 20px; padding: 14px 12px 16px;
  margin: 0 auto 12px; max-width: 520px; position: relative;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.6), var(--shadow);
}
.car-cabin::before {
  content: ""; position: absolute; top: -8px; left: 20%; right: 20%; height: 10px;
  background: #94a3b8; border-radius: 8px 8px 0 0;
}
.seats-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px;
}
.buckle-seat {
  background: #fff; border: 3px solid var(--sky-200); border-radius: 16px;
  padding: 10px 8px; text-align: center; position: relative;
  min-height: 160px; display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.buckle-seat.ok { border-color: var(--mint); background: var(--mint-soft); }
.buckle-seat.bad { border-color: var(--coral); background: var(--coral-soft); }
.buckle-seat .avatar {
  width: 48px; height: 56px; position: relative;
}
.buckle-seat .avatar .head {
  width: 28px; height: 28px; background: #fcd34d; border-radius: 50%;
  margin: 0 auto; border: 2px solid #b45309;
}
.buckle-seat .avatar .torso {
  width: 36px; height: 28px; background: #0ea5e9; border-radius: 8px 8px 4px 4px;
  margin: -2px auto 0; position: relative;
}
.buckle-seat .belt-line {
  position: absolute; top: 36px; left: 8px; right: 8px; height: 6px;
  background: transparent; border-radius: 3px; pointer-events: none;
  transition: background .2s, transform .2s;
}
.buckle-seat.ok .belt-line {
  background: linear-gradient(90deg, #64748b, #334155);
  transform: rotate(-18deg); top: 42px;
}
.buckle-seat .seat-label { font-weight: 900; font-size: .95rem; color: var(--ink); }
.buckle-seat .status-txt {
  font-weight: 800; font-size: .85rem; color: var(--coral);
}
.buckle-seat.ok .status-txt { color: #047857; }
.buckle-btn {
  width: 100%; min-height: 44px; border-radius: 12px; border: 2px solid var(--sky-400);
  background: linear-gradient(180deg, #fff, var(--sky-50));
  font-weight: 900; color: var(--sky-700); font-size: 1rem;
  box-shadow: 0 3px 0 rgba(2,132,199,.12);
}
.buckle-seat.ok .buckle-btn {
  background: var(--mint); color: #fff; border-color: #059669;
}
.distract {
  font-size: .8rem; font-weight: 700; color: #92400e;
  background: var(--amber-soft); border-radius: 8px; padding: 4px 6px;
}
.go-drive {
  margin-top: 10px; width: 100%;
}
.fix-note {
  text-align: center; font-weight: 800; color: var(--sky-700); margin: 8px 0 0;
}
</style>
</head>

        know:"גַּם בַּמּוֹשָׁב הָאֲחוֹרִי — חֲגוֹרָה לְכָל אֶחָד." },
      { id:"y6", type:"buckle", q:"תַּרְגִּיל: חִגְרוּ אֶת כָּל הַיּוֹשְׁבִים לִפְנֵי הַנְּסִיעָה",
        seats:[
          {id:"a", name:"נהג/ת", start:false},
          {id:"b", name:"יַנְקִין", start:false, distract:"תִּיק עַל הַבִּרְכַּיִם"},
          {id:"c", name:"אָחוֹר", start:false}
        ],
        reveal:"חֲגוֹרָה לְכָל אֶחָד לִפְנֵי נְסִיעָה",
        know:"חֲגוֹרָה לְכָל אֶחָד — וְרַק אַחַר כָּךְ נוֹסְעִים." },
      { id:"y7", type:"mc", friend:"סבבה בלי חגורה",
        q:"חָבֵר בְּלִי חֲגוֹרָה. מָה אוֹמְרִים?",
        choices:[
          {t:"»סְבָבָה«", ok:false},
          {t:"»תַּחְגֹּר — כָּכָה בְּטוּחַ«", ok:true},
          {t:"»נְנַתֵּק אֶת שֶׁלִּי«", ok:false},
          {t:"»נִסְתַּתֵּר«", ok:false}
        ],
        know:"אוֹמְרִים לַחָבֵר לַחֲגֹר — כָּכָה בְּטוּחַ." },
      { id:"y8", type:"mc", q:"אֵיפֹה הַחֲגוֹרָה עַל הַגּוּף?",
        choices:[
          {t:"עַל הַצַּוָּאר", ok:false},
          {t:"עַל הַכָּתֵף וְעַל הָאֲגָנִים (לֹא עַל הַבֶּטֶן הָרַכָּה)", ok:true},
          {t:"עַל הַמִּצְחַ", ok:false},
          {t:"רַק עַל יָד אַחַת", ok:false}
        ],
        know:"חֲגוֹרָה עַל הַכָּתֵף וְעַל הָאֲגָנִים — לֹא עַל הַצַּוָּאר אוֹ הַבֶּטֶן הָרַכָּה." },
      { id:"y9", type:"mc", q:"הָרֶכֶב עָצַר לַגַמְרֵי — מָתַי מְשַׁחְרְרִים?",
        choices:[
          {t:"בַּנְּסִיעָה", ok:false},
          {t:"אַחֲרֵי עֲצִירָה", ok:true},
          {t:"בְּאֶמְצַע כְּבִישׁ", ok:false},
          {t:"כְּשֶׁרוֹאִים חָבֵר בַּחַלּוֹן", ok:false}
        ],
        know:"מְשַׁחְרְרִים רַק אַחֲרֵי עֲצִירָה מֻחְלֶטֶת." },
      { id:"y10", type:"knowledge-only", q:"סִיּוּם יֶדַע",
        know:"חֲגוֹרָה לְכָל אֶחָד, בְּכָל נְסִיעָה, עַד שֶׁעוֹצְרִים." }
    ],
    older: [
      { id:"o1", type:"mc", q:"למה חגורה גם בנסיעה קצרה בשכונה?",
        choices:[
          {t:"אין צורך", ok:false},
          {t:"תאונות קורות גם קרוב לבית", ok:true},
          {t:"רק בשביל קנס", ok:false},
          {t:"רק אם יש גשם", ok:false}
        ],
        know:"תאונות קורות גם קרוב לבית — חגורה בכל נסיעה." },
      { id:"o2", type:"mc", q:"מושב אחורי — חובה חינוכית?",
        choices:[
          {t:"לא", ok:false},
          {t:"כן — כולם חגורים", ok:true},
          {t:"רק ליד הדלת", ok:false},
          {t:"רק בכביש בין-עירוני", ok:false}
        ],
        know:"גם במושב אחורי — כולם חגורים." },
      { id:"o3", type:"mc", q:"תיק על הברכיים במקום חגורה?",
        choices:[
          {t:"מחליף חגורה", ok:false},
          {t:"לא מחליף — חוגרים קודם", ok:true},
          {t:"רק אם התיק כבד", ok:false},
          {t:"רק בבוקר", ok:false}
        ],
        know:"תיק לא מחליף חגורה — חוגרים קודם." },
      { id:"o4", type:"mc", q:"מתי מותר לשחרר?",
        choices:[
          {t:"כשרואים את הבית מרחוק", ok:false},
          {t:"אחרי עצירה מוחלטת", ok:true},
          {t:"ברמזור אדום תמיד", ok:false},
          {t:"כשמשעמם", ok:false}
        ],
        know:"משחררים רק אחרי עצירה מוחלטת." },
      { id:"o5", type:"mc", q:"כסא בטיחות / בוסטר — מסר חינוכי:",
        choices:[
          {t:"לפי גיל/גובה/משקל והנחיות מתאימות — עם מבוגר ובדיקה מול מקורות רשמיים", ok:true},
          {t:"אף פעם לא צריך", ok:false},
          {t:"רק בטיול שנתי", ok:false},
          {t:"רק ברכב חדש", ok:false}
        ],
        know:"כסא בטיחות/בוסטר — לפי הנחיות מתאימות ועם מבוגר (לוודא מול מקור רשמי)." },
      { id:"o6", type:"buckle", q:"תרגיל: חגורה מפותלת / תיק — תיישרו וחגרו את כולם",
        seats:[
          {id:"a", name:"נהג", start:true},
          {id:"b", name:"ליד נהג", start:false, distract:"חגורה מתחת ליד"},
          {id:"c", name:"אחורי ימין", start:false, distract:"תיק על המושב"},
          {id:"d", name:"אחורי שמאל", start:false}
        ],
        reveal:"מיישרים לחגירה נכונה — כולם חגורים לפני נסיעה",
        know:"מיישרים חגורה מפותלת או מתחת ליד — ואז נועלים." },
      { id:"o7", type:"mc", friend:"רק לשתי דקות בלי חגורה",
        q:"נהג אומר »רק לשתי דקות בלי חגורה«. תגובה?",
        choices:[
          {t:"מסכימים", ok:false},
          {t:"מתעקשים לחגור — כל נסיעה", ok:true},
          {t:"יורדים תוך כדי נסיעה", ok:false},
          {t:"מצלמים סטורי", ok:false}
        ],
        know:"מתעקשים לחגור — כל נסיעה, גם קצרה." },
      { id:"o8", type:"buckle", q:"תרחיש: שלושה ילדים — חגרו את כולם לפני נסיעה",
        seats:[
          {id:"a", name:"ילד 1", start:true},
          {id:"b", name:"ילד 2", start:true},
          {id:"c", name:"ילד 3", start:false}
        ],
        reveal:"לא נוסעים עד שלכולם פתרון בטיחות מתאים",
        know:"לא נוסעים עד שכולם חגורים כראוי." },
      { id:"o9", type:"mc", q:"מה החגורה עושה ברמת הסבר פשוט?",
        choices:[
          {t:"מקשטת", ok:false},
          {t:"מחזיקה את הגוף ומפחיתה פגיעה בעצירה חזקה", ok:true},
          {t:"מחממת בלבד", ok:false},
          {t:"פותחת דלתות", ok:false}
        ],
        know:"החגורה מחזיקה את הגוף ומפחיתה פגיעה בעצירה חזקה." },
      { id:"o10", type:"knowledge-only", q:"סיכום",
        know:"חגורה = הגנה. כל מושב, כל נסיעה, עד עצירה." }
    ]
  };

  let age=null, idx=0, score=0, attempts=0, locked=false, items=[];
  let seatState = {};
  const $ = (s) => document.querySelector(s);
  const hub=$("#screen-hub"), play=$("#screen-play"), know=$("#screen-knowledge"), end=$("#screen-end");

  function show(screen) {
    [hub,play,know,end].forEach(s => s.classList.remove("active"));
    screen.classList.add("active");
    const f = screen.querySelector("button:not([disabled]), [tabindex='0']");
    if (f) setTimeout(() => f.focus(), 50);
  }
  function live(msg) { $("#live").textContent = msg; }
  function esc(s) { const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

  function setAge(a) {
    age = a;
    document.body.classList.toggle("young", a==="young");
    document.body.classList.toggle("older", a==="older");
    document.querySelectorAll(".age-btn").forEach(b => {
      const on = b.dataset.age === a;
      b.classList.toggle("selected", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    const u = UI[a];
    $("#hub-title").textContent = u.title;
    $("#hub-sub").textContent = u.sub;
    $("#startBtn").textContent = u.start; $("#startBtn").disabled = false;
    $("#age-prompt").textContent = u.agePrompt;
    $("#nextBtn").textContent = u.next;
    $("#knowNext").textContent = u.next;
    $("#know-title").textContent = u.knowTitle;
    $("#againBtn").textContent = u.again;
  }

  function updateProgress() {
    const total = items.length;
    const pct = total ? Math.round((idx/total)*100) : 0;
    const bar = $("#progressBar");
    bar.style.width = pct+"%"; bar.setAttribute("aria-valuenow", pct);
    $("#q-counter").textContent = Math.min(idx+1,total)+" / "+total;
    $("#q-score").textContent = "★ "+score;
  }

  function renderMc(item) {
    const wrap = document.createElement("div");
    wrap.className = "choices";
    wrap.setAttribute("role","group"); wrap.setAttribute("aria-label","תשובות");
    const letters = ["א","ב","ג","ד"];
    item.choices.forEach((c,i) => {
      const b = document.createElement("button");
      b.type="button"; b.className="choice"; b.dataset.i=i;
      b.innerHTML = '<span class="letter">'+letters[i]+'</span><span>'+c.t+'</span><span class="mark" aria-hidden="true"></span>';
      b.addEventListener("click", () => onChoose(i));
      wrap.appendChild(b);
    });
    $("#q-body").appendChild(wrap);
  }

  function renderBuckle(item) {
    const u = UI[age];
    seatState = {};
    item.seats.forEach(s => { seatState[s.id] = !!s.start; });
    const cabin = document.createElement("div");
    cabin.className = "car-cabin";
    cabin.setAttribute("role", "group");
    cabin.setAttribute("aria-label", "תא נוסעים — חגרו את כולם");
    const row = document.createElement("div");
    row.className = "seats-row";
    item.seats.forEach(s => {
      const seat = document.createElement("div");
      seat.className = "buckle-seat" + (seatState[s.id] ? " ok" : "");
      seat.id = "seat-"+s.id;
      seat.innerHTML =
        '<div class="avatar" aria-hidden="true"><div class="head"></div><div class="torso"></div><div class="belt-line"></div></div>' +
        '<div class="seat-label">'+esc(s.name)+'</div>' +
        (s.distract ? '<div class="distract">'+esc(s.distract)+'</div>' : '') +
        '<div class="status-txt" id="st-'+s.id+'">'+(seatState[s.id]?u.buckled:u.notBuckled)+'</div>' +
        '<button type="button" class="buckle-btn" data-sid="'+s.id+'" aria-pressed="'+(seatState[s.id]?"true":"false")+'">'+(seatState[s.id]?u.buckled:u.buckle)+'</button>';
      row.appendChild(seat);
    });
    cabin.appendChild(row);
    $("#scene-host").appendChild(cabin);
    const note = document.createElement("p");
    note.className = "fix-note";
    note.textContent = u.drive;
    $("#q-body").appendChild(note);
    const go = document.createElement("button");
    go.type = "button"; go.className = "primary-btn go-drive"; go.id = "driveBtn";
    go.textContent = u.driveOk;
    go.addEventListener("click", () => tryDrive(item));
    $("#q-body").appendChild(go);
    cabin.querySelectorAll(".buckle-btn").forEach(btn => {
      btn.addEventListener("click", () => toggleSeat(btn.dataset.sid, item));
    });
  }

  function toggleSeat(sid, item) {
    if (locked) return;
    const u = UI[age];
    seatState[sid] = !seatState[sid];
    sfx("buckle");
    const seat = $("#seat-"+sid);
    const btn = seat.querySelector(".buckle-btn");
    const st = $("#st-"+sid);
    seat.classList.toggle("ok", seatState[sid]);
    seat.classList.remove("bad");
    btn.textContent = seatState[sid] ? u.buckled : u.buckle;
    btn.setAttribute("aria-pressed", seatState[sid] ? "true" : "false");
    st.textContent = seatState[sid] ? u.buckled : u.notBuckled;
    live(st.textContent + " — " + item.seats.find(s=>s.id===sid).name);
  }

  function tryDrive(item) {
    if (locked) return;
    const u = UI[age];
    const all = item.seats.every(s => seatState[s.id]);
    if (all) {
      locked = true;
      score += Math.max(1, 3 - attempts);
      sfx("ok"); showFb(true);
      $("#nextBtn").hidden = false; $("#nextBtn").focus();
      live(u.driveOk);
      document.querySelectorAll(".buckle-btn, #driveBtn").forEach(b => b.disabled = true);
    } else {
      attempts++;
      sfx("bad");
      item.seats.forEach(s => {
        if (!seatState[s.id]) {
          const seat = $("#seat-"+s.id);
          if (seat) seat.classList.add("bad");
        }
      });
      if (attempts >= 2) {
        locked = true;
        // auto-buckle reveal
        item.seats.forEach(s => {
          seatState[s.id] = true;
          const seat = $("#seat-"+s.id);
          if (seat) {
            seat.classList.add("ok"); seat.classList.remove("bad");
            seat.querySelector(".buckle-btn").textContent = u.buckled;
            $("#st-"+s.id).textContent = u.buckled;
          }
        });
        showFb(false, true);
        $("#feedback").querySelector(".feedback-text").textContent = u.reveal + " " + (item.reveal||"");
        $("#nextBtn").hidden = false;
        live(u.reveal);
        document.querySelectorAll(".buckle-btn, #driveBtn").forEach(b => b.disabled = true);
      } else {
        showFb(false, false);
        live(u.driveBad);
      }
    }
    updateProgress();
  }

  function onChoose(i) {
    if (locked) return;
    const item = items[idx];
    const choice = item.choices[i];
    const buttons = $("#q-body").querySelectorAll(".choice");
    buttons.forEach(b => b.classList.remove("selected"));
    const btn = $("#q-body").querySelector('[data-i="'+i+'"]');
    if (btn) btn.classList.add("selected");
    if (choice.ok) {
      locked = true;
      markResult(buttons, item, true, i);
      score += Math.max(1, 3 - attempts);
      sfx("ok"); showFb(true);
      $("#nextBtn").hidden = false; $("#nextBtn").focus();
      live(UI[age].ok);
    } else {
      attempts++;
      sfx("bad");
      if (btn) { btn.classList.add("wrong"); const m=btn.querySelector(".mark"); if(m) m.textContent="✗"; }
      if (attempts >= 2) {
        locked = true; markResult(buttons, item, false, i);
        showFb(false, true); $("#nextBtn").hidden = false; live(UI[age].reveal);
      } else {
        showFb(false, false); live(UI[age].bad);
        if (btn) btn.disabled = true;
      }
    }
    updateProgress();
  }

  function markResult(buttons, item, wasCorrect, chosen) {
    buttons.forEach(b => {
      const i = +b.dataset.i; b.disabled = true;
      if (item.choices[i] && item.choices[i].ok) {
        b.classList.add("correct");
        const mark = b.querySelector(".mark");
        if (mark) mark.textContent = "✓";
      } else if (i === chosen) {
        b.classList.add("wrong");
        const mark = b.querySelector(".mark");
        if (mark) mark.textContent = "✗";
      }
    });
  }

  function showFb(ok, revealed) {
    const fb = $("#feedback"); const u = UI[age];
    fb.className = "feedback show " + (ok ? "ok" : (revealed ? "info" : "bad"));
    if (ok) fb.innerHTML = "<span aria-hidden='true'>✓</span><span class='feedback-text'>"+u.ok+"</span>";
    else if (revealed) {
      const item = items[idx];
      const ans = item.choices ? item.choices.find(c => c.ok).t : (item.reveal || "");
      fb.innerHTML = "<span aria-hidden='true'>💡</span><span class='feedback-text'>"+u.reveal+" "+ans+"</span>";
    } else fb.innerHTML = "<span aria-hidden='true'>✗</span><span class='feedback-text'>"+u.bad+"</span>";
  }

  function showKnowledge(text) {
    sfx("know"); $("#know-text").textContent = text; show(know); live(text);
  }

  function renderItem() {
    locked = false; attempts = 0;
    updateProgress(); $("#progressWrap").hidden = false;
    const item = items[idx];
    $("#feedback").className = "feedback"; $("#feedback").textContent = "";
    $("#nextBtn").hidden = true;
    $("#scene-host").innerHTML = ""; $("#q-body").innerHTML = "";
    $("#q-title").textContent = item.q;
    if (item.type === "knowledge-only") { showKnowledge(item.know); return; }
    if (item.friend) {
      $("#scene-host").innerHTML = '<div style="text-align:center"><span class="friend-bubble" role="img" aria-label="חבר">🗣️ «'+esc(item.friend)+'»</span></div>';
    }
    if (item.type === "buckle") renderBuckle(item);
    else renderMc(item);
    show(play);
  }

  function afterItem() {
    const item = items[idx];
    if (item.know) showKnowledge(item.know);
    else advance();
  }
  function advance() {
    idx++;
    if (idx >= items.length) finish();
    else renderItem();
  }
  function finish() {
    $("#progressBar").style.width = "100%";
    const u = UI[age];
    $("#end-title").textContent = u.endTitle;
    $("#end-sub").textContent = u.endSub;
    const maxScore = items.filter(it => it.type !== "knowledge-only").length * 3;
    const ratio = maxScore ? Math.min(1, score / maxScore) : 1;
    let stars = ratio >= 0.75 ? 3 : ratio >= 0.45 ? 2 : 1;
    document.querySelectorAll(".star").forEach(s => s.classList.toggle("on", +s.dataset.i <= stars));
    $("#end-score").textContent = "ניקוד: "+score+" · כוכבים: "+stars+" / 3";
    $("#end-stars").setAttribute("aria-label", stars+" כוכבים מתוך 3");
    sfx("win"); show(end); live(u.endTitle+" "+stars+" כוכבים");
  }
  function startGame() {
    if (!age) return;
    items = ITEMS[age].slice();
    idx = 0; score = 0;
    renderItem();
  }

  $("#age-young").addEventListener("click", () => setAge("young"));
  $("#age-older").addEventListener("click", () => setAge("older"));
  $("#startBtn").addEventListener("click", startGame);
  $("#nextBtn").addEventListener("click", afterItem);
  $("#knowNext").addEventListener("click", advance);
  $("#againBtn").addEventListener("click", () => {
    $("#progressWrap").hidden = true; $("#progressBar").style.width = "0%";
    show(hub); $("#startBtn").focus();
  });
  $("#muteBtn").addEventListener("click", () => {
    muted = !muted;
    $("#muteBtn").setAttribute("aria-pressed", muted ? "true" : "false");
    $("#muteBtn").textContent = muted ? "🔇" : "🔊";
    $("#muteBtn").setAttribute("aria-label", muted ? "בטלו השתקה" : "השתקה");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "m" || e.key === "M" || e.key === "מ") {
      if (e.target.tagName !== "INPUT") $("#muteBtn").click();
    }
  });

  setAge("young"); age = null;
  document.querySelectorAll(".age-btn").forEach(b => { b.classList.remove("selected"); b.setAttribute("aria-pressed","false"); });
  $("#startBtn").disabled = true;
  $("#hub-title").textContent = "חֲגוֹרָה לְכָל אֶחָד";
  $("#hub-sub").textContent = "מִשְׂחַק »חֲגֹר־וּסַע« · בְּטִיחוּת בַּדֶּרֶךְ";
  $("#startBtn").textContent = "הַתְחֵלָה";
})();
</script>
</body>
</html>
