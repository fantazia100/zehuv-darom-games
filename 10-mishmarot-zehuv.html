<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>משמרות זה״ב — שבוע זה״ב | מחוז דרום</title>
<style>

:root {
  --sky-50: #f0f9ff; --sky-100: #e0f2fe; --sky-200: #bae6fd; --sky-300: #7dd3fc;
  --sky-500: #0ea5e9; --sky-600: #0284c7; --sky-700: #0369a1;
  --ink: #0f2744; --ink-soft: #334e68; --muted: #5a7a94;
  --paper: #ffffff; --card: #ffffff;
  --mint: #10b981; --mint-soft: #d1fae5;
  --coral: #ef4444; --coral-soft: #fee2e2;
  --amber: #f59e0b; --amber-soft: #fef3c7; --gold: #fbbf24;
  --radius: 1.1rem; --radius-btn: .85rem;
  --shadow: 0 10px 28px -10px rgba(15,39,68,.18), 0 2px 8px rgba(15,39,68,.06);
  --shadow-3d: 0 14px 0 -2px rgba(2,132,199,.12), 0 18px 36px -12px rgba(15,39,68,.22);
  --focus: 3px solid #0369a1;
  --font: Assistant, Heebo, Rubik, Arial, sans-serif;
  --touch: 48px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  font-family: var(--font); color: var(--ink);
  background:
    radial-gradient(1200px 600px at 100% -10%, #bae6fd 0%, transparent 55%),
    radial-gradient(900px 500px at -10% 110%, #a5f3fc 0%, transparent 50%),
    linear-gradient(180deg, var(--sky-50), #e8f7ff 40%, #f0f9ff);
  -webkit-tap-highlight-color: transparent;
}
body { line-height: 1.45; }
button, [role="button"] {
  font-family: inherit; cursor: pointer;
  min-height: var(--touch); min-width: var(--touch);
}
button:focus-visible, [tabindex="0"]:focus-visible, .choice:focus-visible,
.door-btn:focus-visible, .vis-opt:focus-visible, .lane-slot:focus-visible,
.msg-opt:focus-visible, .dir-btn:focus-visible, .place-car:focus-visible {
  outline: var(--focus); outline-offset: 3px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.app {
  max-width: 920px; margin: 0 auto; padding: 12px 14px 88px;
  min-height: 100dvh; position: relative;
}
.logo-corner {
  position: fixed; top: 10px; left: 10px; z-index: 40;
  height: 48px; width: auto; pointer-events: none;
  filter: drop-shadow(0 2px 6px rgba(15,39,68,.15));
}
@media (max-width: 480px) { .logo-corner { height: 40px; } }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
}
.brand-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.85); border: 1px solid var(--sky-200);
  border-radius: 999px; padding: 6px 12px 6px 8px;
  font-size: .85rem; color: var(--sky-700); font-weight: 700;
  box-shadow: var(--shadow);
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: var(--touch); height: var(--touch);
  border-radius: 50%; border: 2px solid var(--sky-200);
  background: var(--paper); color: var(--ink); font-size: 1.25rem;
  box-shadow: var(--shadow);
}
.icon-btn[aria-pressed="true"] { background: var(--amber-soft); border-color: var(--amber); }
.progress-wrap {
  flex: 1; min-width: 140px; max-width: 280px;
  background: rgba(255,255,255,.7); border-radius: 999px; height: 12px;
  border: 1px solid var(--sky-200); overflow: hidden;
}
.progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--sky-500), var(--mint));
  border-radius: 999px; transition: width .35s ease;
}
@media (prefers-reduced-motion: reduce) {
  .progress-bar, .card, .feedback, .star, .screen.active,
  .car-anim, .door-btn, .vis-opt { transition: none !important; animation: none !important; }
}
.screen { display: none; }
.screen.active { display: block; animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-3d); border: 1px solid rgba(14,165,233,.18);
  padding: 22px 20px 24px; position: relative;
}
.hero-icon {
  width: 88px; height: 88px; margin: 0 auto 12px;
  display: grid; place-items: center;
  background: linear-gradient(160deg, #e0f2fe, #cffafe);
  border-radius: 24px; border: 2px solid var(--sky-200);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.8), 0 8px 0 rgba(2,132,199,.1);
}
h1 {
  margin: 0 0 8px; text-align: center;
  font-size: clamp(1.7rem, 4.5vw, 2.4rem); color: var(--sky-700);
  font-weight: 800; letter-spacing: -.01em;
}
.subtitle {
  text-align: center; color: var(--ink-soft); margin: 0 0 20px;
  font-size: clamp(1rem, 2.5vw, 1.15rem); font-weight: 600;
}
.goals { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
.goals li {
  background: var(--sky-50); border: 1px solid var(--sky-200);
  border-radius: 12px; padding: 10px 14px; font-weight: 700; color: var(--ink-soft);
}
.goals li::before { content: "✓ "; color: var(--mint); font-weight: 900; }
.age-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 20px; }
@media (max-width: 520px) { .age-grid { grid-template-columns: 1fr; } }
.age-btn {
  border: 3px solid var(--sky-200);
  background: linear-gradient(180deg, #fff, var(--sky-50));
  border-radius: var(--radius); padding: 18px 14px; text-align: center;
  box-shadow: var(--shadow); color: var(--ink);
}
.age-btn:hover { border-color: var(--sky-500); }
.age-btn.selected {
  border-color: var(--sky-600);
  background: linear-gradient(180deg, #e0f2fe, #fff);
  box-shadow: 0 0 0 3px rgba(14,165,233,.25), var(--shadow);
}
.age-btn .age-label { display: block; font-size: 1.35rem; font-weight: 800; color: var(--sky-700); }
.age-btn .age-hint { display: block; margin-top: 4px; font-size: .95rem; color: var(--muted); font-weight: 600; }
.primary-btn, .next-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px 18px;
  border-radius: var(--radius-btn); font-size: 1.2rem; font-weight: 800;
  border: none; min-height: 52px;
}
.primary-btn {
  background: linear-gradient(180deg, #38bdf8, #0284c7); color: #fff;
  box-shadow: 0 6px 0 #0369a1, 0 10px 20px rgba(2,132,199,.28);
}
.primary-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.next-btn {
  background: linear-gradient(180deg, #34d399, #059669); color: #fff;
  box-shadow: 0 6px 0 #047857, 0 10px 20px rgba(16,185,129,.25); margin-top: 14px;
}
.q-meta {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
  font-weight: 700; color: var(--muted); font-size: .95rem;
}
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--sky-100); color: var(--sky-700);
  border-radius: 999px; padding: 4px 12px; font-size: .9rem;
}
.question {
  font-size: clamp(1.25rem, 3.2vw, 1.65rem);
  font-weight: 800; margin: 0 0 16px; color: var(--ink); text-align: right;
}
.young .question, .young .choice, .young .knowledge-text, .young .age-btn .age-label,
.young h1, .young .subtitle, .young .feedback-text {
  font-size: clamp(1.3rem, 3.4vw, 1.75rem);
}
.young .choice { font-size: clamp(1.15rem, 3vw, 1.4rem); }
.choices { display: grid; gap: 10px; }
.choice {
  display: flex; align-items: flex-start; gap: 12px;
  text-align: right; width: 100%; padding: 14px;
  border-radius: 14px; border: 2.5px solid var(--sky-200);
  background: linear-gradient(180deg, #fff, #f8fcff);
  color: var(--ink); font-size: 1.1rem; font-weight: 700;
  box-shadow: 0 4px 0 rgba(2,132,199,.08);
}
.choice .letter {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px;
  display: grid; place-items: center; background: var(--sky-100);
  color: var(--sky-700); font-weight: 900; font-size: .95rem;
}
.choice .mark { margin-inline-start: auto; font-weight: 900; }
.choice.selected { border-color: var(--sky-500); background: #e0f2fe; }
.choice.correct, .door-btn.correct, .vis-opt.correct, .msg-opt.correct,
.lane-slot.correct, .dir-btn.correct, .place-car.correct {
  border-color: var(--mint) !important; background: var(--mint-soft) !important;
}
.choice.wrong, .door-btn.wrong, .vis-opt.wrong, .msg-opt.wrong,
.lane-slot.wrong, .dir-btn.wrong, .place-car.wrong {
  border-color: var(--coral) !important; background: var(--coral-soft) !important;
}
.feedback {
  display: none; margin-top: 12px; padding: 12px 14px; border-radius: 12px;
  font-weight: 800; align-items: center; gap: 8px;
}
.feedback.show { display: flex; }
.feedback.ok { background: var(--mint-soft); color: #065f46; border: 2px solid var(--mint); }
.feedback.bad { background: var(--coral-soft); color: #991b1b; border: 2px solid var(--coral); }
.feedback.info { background: var(--amber-soft); color: #92400e; border: 2px solid var(--amber); }
.knowledge { text-align: center; padding: 8px 4px; }
.knowledge-icon {
  width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 18px;
  display: grid; place-items: center; font-size: 2rem;
  background: linear-gradient(160deg, #fef3c7, #e0f2fe); border: 2px solid var(--amber);
}
.knowledge-text { font-size: clamp(1.15rem, 3vw, 1.4rem); font-weight: 800; color: var(--ink); margin: 0 0 8px; }
.hint-note { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 10px; font-weight: 600; }
.live-region { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.end-stars { display: flex; justify-content: center; gap: 10px; margin: 16px 0; font-size: 2.4rem; }
.star { opacity: .25; filter: grayscale(1); }
.star.on { opacity: 1; filter: none; transform: scale(1.1); }
.friend-bubble {
  display: inline-block; background: #fff; border: 2px solid var(--sky-300);
  border-radius: 16px; padding: 10px 14px; font-weight: 800; color: var(--ink-soft);
  box-shadow: var(--shadow); margin-bottom: 10px;
}


.post-scene {
  position: relative; height: 180px; border-radius: 16px; overflow: hidden;
  border: 2px solid #ca8a04; margin-bottom: 14px;
  background: linear-gradient(180deg, #fef9c3 0%, #fde68a 40%, #86efac 40%, #86efac 55%, #64748b 55%);
}
.zehuv-vest {
  position: absolute; bottom: 40px; right: 30%;
  width: 50px; height: 60px;
}
.msg-grid { display: grid; gap: 10px; }
.msg-opt {
  border: 2.5px solid #ca8a04; border-radius: 14px; padding: 14px;
  background: linear-gradient(180deg, #fffbeb, #fff);
  font-weight: 800; color: #1e293b; text-align: right;
  box-shadow: var(--shadow); min-height: 52px;
  display: flex; align-items: center; gap: 10px; font-size: 1.05rem;
}
.msg-opt .msg-icon { flex-shrink: 0; font-size: 1.4rem; }
.sign-board {
  display: inline-flex; align-items: center; gap: 8px;
  background: #fbbf24; color: #1e293b; border: 3px solid #1e293b;
  border-radius: 12px; padding: 10px 16px; font-weight: 900; margin-bottom: 8px;
}

</style>
</head>

          {t:"מסרבים בעדינות ומזכירים את הכלל", ok:true, tone:"good"},
          {t:"מצטרפים", ok:false, tone:"bad"},
          {t:"מכבים את הרמזור", ok:false, tone:"bad"}
        ],
        reveal:"מסרבים בעדינות ומזכירים את הכלל",
        know:"מסרבים בעדינות ומזכירים את הכלל — גם לחבר." },
      { id:"o8", type:"mc", q:"קשר למשחקי חצייה ומבט:",
        choices:[
          {t:"המשמרת ממציאה כללים אחרים", ok:false},
          {t:"המשמרת מחזקת את אותם כללים — לא כללים אחרים", ok:true},
          {t:"אין קשר", ok:false},
          {t:"רק בחורף", ok:false}
        ],
        know:"המשמרת מחזקת את אותם כללי חצייה ומבט." },
      { id:"o9", type:"mc", q:"גאוות יחידה + צניעות:",
        choices:[
          {t:"מתנשאים על תלמידים אחרים", ok:false},
          {t:"גאים בתפקיד, לא מתנשאים", ok:true},
          {t:"מתעלמים מכולם", ok:false},
          {t:"רק לבוגרים מותר גאווה", ok:false}
        ],
        know:"גאים בתפקיד — בלי להתנשא על אחרים." },
      { id:"o10", type:"knowledge-only", q:"סיכום",
        know:"זה״ב = אחריות, דוגמה, מסרים נכונים, קריאה למבוגר כשצריך." }
    ]
  };


  let age=null, idx=0, score=0, attempts=0, locked=false, items=[];
  const $ = (s) => document.querySelector(s);
  const hub=$("#screen-hub"), play=$("#screen-play"), know=$("#screen-knowledge"), end=$("#screen-end");

  function show(screen) {
    [hub,play,know,end].forEach(s => s.classList.remove("active"));
    screen.classList.add("active");
    const f = screen.querySelector("button:not([disabled]), [tabindex='0']");
    if (f) setTimeout(() => f.focus(), 50);
  }
  function live(msg) { $("#live").textContent = msg; }
  function esc(s) { const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

  function setAge(a) {
    age = a;
    document.body.classList.toggle("young", a==="young");
    document.body.classList.toggle("older", a==="older");
    document.querySelectorAll(".age-btn").forEach(b => {
      const on = b.dataset.age === a;
      b.classList.toggle("selected", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    const u = UI[a];
    $("#hub-title").textContent = u.title;
    $("#hub-sub").textContent = u.sub;
    $("#startBtn").textContent = u.start; $("#startBtn").disabled = false;
    $("#age-prompt").textContent = u.agePrompt;
    $("#nextBtn").textContent = u.next;
    $("#knowNext").textContent = u.next;
    $("#know-title").textContent = u.knowTitle;
    $("#againBtn").textContent = u.again;
    $("#end-title").textContent = u.endTitle;
  }

  function updateProgress() {
    const total = items.length;
    const pct = total ? Math.round((idx/total)*100) : 0;
    const bar = $("#progressBar");
    bar.style.width = pct+"%"; bar.setAttribute("aria-valuenow", pct);
    $("#q-counter").textContent = Math.min(idx+1,total)+" / "+total;
    $("#q-score").textContent = "★ "+score;
  }

  function renderMc(item) {
    const wrap = document.createElement("div");
    wrap.className = "choices";
    wrap.setAttribute("role","group"); wrap.setAttribute("aria-label","תשובות");
    const letters = ["א","ב","ג","ד"];
    item.choices.forEach((c,i) => {
      const b = document.createElement("button");
      b.type="button"; b.className="choice"; b.dataset.i=i;
      b.innerHTML = '<span class="letter">'+letters[i]+'</span><span>'+esc(c.t)+'</span><span class="mark" aria-hidden="true"></span>';
      b.addEventListener("click", () => onChoose(i));
      wrap.appendChild(b);
    });
    $("#q-body").appendChild(wrap);
  }

  function onChoose(i) {
    if (locked) return;
    const item = items[idx];
    const choice = item.choices[i];
    const buttons = $("#q-body").querySelectorAll(".choice, .door-btn, .vis-opt, .msg-opt, .dir-btn, .place-car, .lane-slot");
    buttons.forEach(b => b.classList.remove("selected"));
    const btn = $("#q-body").querySelector('[data-i="'+i+'"]') || document.querySelector('[data-i="'+i+'"]');
    if (btn) btn.classList.add("selected");
    if (choice.ok) {
      locked = true;
      markResult(buttons, item, true, i);
      score += Math.max(1, 3 - attempts);
      sfx("ok"); showFb(true);
      $("#nextBtn").hidden = false; $("#nextBtn").focus();
      live(UI[age].ok);
    } else {
      attempts++;
      sfx("bad");
      if (btn) { btn.classList.add("wrong"); const m=btn.querySelector(".mark"); if(m) m.textContent="✗"; }
      if (attempts >= 2) {
        locked = true; markResult(buttons, item, false, i);
        showFb(false, true); $("#nextBtn").hidden = false; live(UI[age].reveal);
      } else {
        showFb(false, false); live(UI[age].bad);
        if (btn) btn.disabled = true;
      }
    }
    updateProgress();
  }

  function markResult(buttons, item, wasCorrect, chosen) {
    buttons.forEach(b => {
      const i = +b.dataset.i; b.disabled = true;
      if (item.choices[i] && item.choices[i].ok) {
        b.classList.add("correct");
        const mark = b.querySelector(".mark");
        if (mark) mark.textContent = "✓";
      } else if (i === chosen) {
        b.classList.add("wrong");
        const mark = b.querySelector(".mark");
        if (mark) mark.textContent = "✗";
      }
    });
  }

  function showFb(ok, revealed) {
    const fb = $("#feedback"); const u = UI[age];
    fb.className = "feedback show " + (ok ? "ok" : (revealed ? "info" : "bad"));
    if (ok) fb.innerHTML = "<span aria-hidden='true'>✓</span><span class='feedback-text'>"+u.ok+"</span>";
    else if (revealed) {
      const item = items[idx];
      const ans = (item.choices && item.choices.find(c => c.ok)) ? item.choices.find(c => c.ok).t : (item.reveal || "");
      fb.innerHTML = "<span aria-hidden='true'>💡</span><span class='feedback-text'>"+u.reveal+" "+esc(ans)+"</span>";
    } else fb.innerHTML = "<span aria-hidden='true'>✗</span><span class='feedback-text'>"+u.bad+"</span>";
  }

  function showKnowledge(text) {
    sfx("know"); $("#know-text").textContent = text; show(know); live(text);
  }


  function postScene() {
    return '<div class="post-scene" role="img" aria-label="עמדת משמרת זה״ב ליד מעבר">' +
      '<div class="sign-board" style="position:absolute;top:12px;right:12px">🦺 זה״ב</div>' +
      '<svg class="zehuv-vest" viewBox="0 0 50 60" width="50" height="60" aria-hidden="true">' +
      '<rect x="8" y="18" width="34" height="36" rx="6" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>' +
      '<rect x="14" y="8" width="22" height="14" rx="4" fill="#fde68a" stroke="#1e293b" stroke-width="2"/>' +
      '<path d="M12 28h26M12 38h26" stroke="#1e293b" stroke-width="3"/>' +
      '<circle cx="25" cy="12" r="5" fill="#fcd34d" stroke="#1e293b"/>' +
      '</svg>' +
      '<svg viewBox="0 0 320 80" width="100%" height="80" style="position:absolute;bottom:0;left:0" aria-hidden="true">' +
      '<rect x="40" y="20" width="240" height="12" fill="#fff" stroke="#1e293b"/>' +
      '<rect x="50" y="20" width="20" height="12" fill="#1e293b"/>' +
      '<rect x="90" y="20" width="20" height="12" fill="#1e293b"/>' +
      '<rect x="130" y="20" width="20" height="12" fill="#1e293b"/>' +
      '<rect x="170" y="20" width="20" height="12" fill="#1e293b"/>' +
      '<rect x="210" y="20" width="20" height="12" fill="#1e293b"/>' +
      '<rect x="250" y="20" width="20" height="12" fill="#1e293b"/>' +
      '</svg></div>';
  }
  function renderMessage(item) {
    $("#scene-host").innerHTML = postScene();
    if (item.friend) {
      $("#scene-host").innerHTML += '<div style="text-align:center"><span class="friend-bubble">🗣️ «'+esc(item.friend)+'»</span></div>';
    }
    const grid = document.createElement("div");
    grid.className = "msg-grid";
    grid.setAttribute("role","group"); grid.setAttribute("aria-label","בחירת מסר");
    item.choices.forEach((c,i) => {
      const b = document.createElement("button");
      b.type="button"; b.className="msg-opt"; b.dataset.i=i;
      const icon = c.tone === "good" ? "✅" : "⚠️";
      b.innerHTML = '<span class="msg-icon" aria-hidden="true">'+icon+'</span><span>'+esc(c.t)+'</span><span class="mark" aria-hidden="true"></span>';
      b.addEventListener("click", () => { sfx("whistle"); onChoose(i); });
      grid.appendChild(b);
    });
    $("#q-body").appendChild(grid);
  }
  function renderSpecial(item) {
    if (item.type === "message") { renderMessage(item); return true; }
    if (item.type === "mc" && !item.friend) {
      $("#scene-host").innerHTML = postScene();
    }
    return false;
  }


  function renderItem() {
    locked = false; attempts = 0;
    updateProgress(); $("#progressWrap").hidden = false;
    const item = items[idx];
    $("#feedback").className = "feedback"; $("#feedback").textContent = "";
    $("#nextBtn").hidden = true;
    $("#scene-host").innerHTML = ""; $("#q-body").innerHTML = "";
    $("#q-title").textContent = item.q;
    if (item.type === "knowledge-only") { showKnowledge(item.know); return; }
    if (item.friend) {
      $("#scene-host").innerHTML = '<div style="text-align:center"><span class="friend-bubble" role="img" aria-label="חבר">🗣️ «'+esc(item.friend)+'»</span></div>';
    }
    if (typeof renderSpecial === "function" && renderSpecial(item)) {
      show(play); return;
    }
    renderMc(item);
    show(play);
  }

  function afterItem() {
    const item = items[idx];
    if (item.know) showKnowledge(item.know);
    else advance();
  }
  function advance() {
    idx++;
    if (idx >= items.length) finish();
    else renderItem();
  }
  function finish() {
    $("#progressBar").style.width = "100%";
    const u = UI[age];
    $("#end-title").textContent = u.endTitle;
    $("#end-sub").textContent = u.endSub;
    const maxScore = items.filter(it => it.type !== "knowledge-only").length * 3;
    const ratio = maxScore ? Math.min(1, score / maxScore) : 1;
    let stars = ratio >= 0.75 ? 3 : ratio >= 0.45 ? 2 : 1;
    document.querySelectorAll(".star").forEach(s => s.classList.toggle("on", +s.dataset.i <= stars));
    $("#end-score").textContent = "ניקוד: "+score+" · כוכבים: "+stars+" / 3";
    $("#end-stars").setAttribute("aria-label", stars+" כוכבים מתוך 3");
    sfx("win"); show(end); live(u.endTitle+" "+stars+" כוכבים");
  }
  function startGame() {
    if (!age) return;
    items = ITEMS[age].slice();
    idx = 0; score = 0;
    renderItem();
  }

  $("#age-young").addEventListener("click", () => setAge("young"));
  $("#age-older").addEventListener("click", () => setAge("older"));
  $("#startBtn").addEventListener("click", startGame);
  $("#nextBtn").addEventListener("click", afterItem);
  $("#knowNext").addEventListener("click", advance);
  $("#againBtn").addEventListener("click", () => {
    $("#progressWrap").hidden = true; $("#progressBar").style.width = "0%";
    show(hub); $("#startBtn").focus();
  });
  $("#muteBtn").addEventListener("click", () => {
    muted = !muted;
    $("#muteBtn").setAttribute("aria-pressed", muted ? "true" : "false");
    $("#muteBtn").textContent = muted ? "🔇" : "🔊";
    $("#muteBtn").setAttribute("aria-label", muted ? "בטלו השתקה" : "השתקה");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "m" || e.key === "M" || e.key === "מ") {
      if (e.target.tagName !== "INPUT") $("#muteBtn").click();
    }
  });

  setAge("young"); age = null;
  document.querySelectorAll(".age-btn").forEach(b => { b.classList.remove("selected"); b.setAttribute("aria-pressed","false"); });
  $("#startBtn").disabled = true;
  $("#hub-title").textContent = 'מִשְׁמְרוֹת זֶה״ב';
  $("#hub-sub").textContent = 'מִשְׂחַק »עֶמְדַת מִשְׁמֶרֶת« · בְּטִיחוּת בַּדֶּרֶךְ';
})();
</script>
</body>
</html>
